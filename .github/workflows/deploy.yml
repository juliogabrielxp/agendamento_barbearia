name: Deploy to EC2

# Os testes rodam em toda branch e em PR para a main, para validar antes do merge.
# O deploy só acontece em push na main (ver o "if" do job deploy).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 8.4 e não 8.3: o composer.lock tem Symfony 8.1, que exige PHP >= 8.4.1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      # Os testes rodam em SQLite em memória (phpunit.xml); o .env só fornece o APP_KEY
      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar testes
        run: php artisan test

  # A mesma suíte de feature no MySQL 8, o motor de produção: lock, FK, unique e tamanho de
  # coluna se comportam diferente no SQLite. Mesmo banco e porta do mysql-test do docker-compose.yml,
  # que é para onde o phpunit.mysql.xml aponta.
  test-mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agendamento_test
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Rodar testes no MySQL
        run: php vendor/bin/phpunit -c phpunit.mysql.xml

  deploy:
    needs: [test, test-mysql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Build do front-end
        run: |
          npm ci
          npm run build

      - name: Enviar build para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "public/build/*"
          target: "/var/www/barbearia.juliogabrieldev.com/public/build"
          strip_components: 2
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: bash /var/www/barbearia.juliogabrieldev.com/deploy.sh
